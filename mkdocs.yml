site_name: Deep-UQ
site_description: Unified uncertainty quantification toolkit in PyTorch.
site_url: https://vispikarkaria.github.io/Deep-UQ/
repo_url: https://github.com/Vispikarkaria/Deep-UQ
repo_name: Vispikarkaria/Deep-UQ
edit_uri: edit/master/docs/
use_directory_urls: true
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - section-index
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      enable_parallel_processing: false
      fallback_to_build_date: true
      strict: false
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            show_source: false
            show_root_toc_entry: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            filters:
              - "!^_"
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - assets/stylesheets/extra-v2.css

extra_javascript:
  - assets/javascripts/extra-v2.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - assets/javascripts/katex.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Methods:
      - Variational Inference: methods/variational-inference.md
      - Laplace Approximation: methods/laplace.md
      - MCMC (SGLD): methods/mcmc-sgld.md
      - MC Dropout: methods/mc-dropout.md
      - Gaussian Processes: methods/gaussian-processes.md
  - Tutorials:
      - tutorials/index.md
      - Bayes by Backprop: tutorials/bayes-by-backprop.md
      - Laplace Comparison: tutorials/laplace-comparison.md
      - MC Dropout: tutorials/mc-dropout.md
      - SGLD: tutorials/sgld.md
      - Gaussian Processes: tutorials/gp.md
  - Examples: examples/index.md
  - API:
      - api/index.md
      - Methods:
          - VI API: api/methods/vi.md
          - Laplace API: api/methods/laplace.md
          - MCMC API: api/methods/mcmc.md
          - MC Dropout API: api/methods/mc_dropout.md
      - Models:
          - MLP API: api/models/simple.md
          - Gaussian Process API: api/models/gaussian_process.md
      - Utils API: api/utils.md
  - Changelog: changelog.md
  - Contributing: contributing.md
