site_name: Deep-UQ
site_description: Unified uncertainty quantification toolkit for deep learning in PyTorch. Six method families, any model architecture, one API.
site_url: https://vispikarkaria.github.io/Deep-UQ/
repo_url: https://github.com/Vispikarkaria/Deep-UQ
repo_name: Vispikarkaria/Deep-UQ
edit_uri: edit/master/docs/
use_directory_urls: true
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - toc.follow
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - section-index
  - mkdocs-jupyter:
      include_source: true
      execute: false
      allow_errors: true
      include: ["docs/gallery/*.ipynb"]
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      enable_parallel_processing: false
      fallback_to_build_date: true
      strict: false
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            show_source: false
            show_root_toc_entry: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            filters:
              - "!^_"
  - minify:
      minify_html: true
  - social:
      cards_layout_options:
        background_color: "#0c2944"
        color: "#f5faff"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Vispikarkaria/Deep-UQ
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/uqdeepnn/
  analytics:
    provider: google
    property: G-KHK5GPNVLN
  status:
    new: Recently added
    deprecated: Deprecated
  generator: false

extra_css:
  - assets/stylesheets/extra-v2.css

extra_javascript:
  - assets/javascripts/extra-v2.js
  - assets/javascripts/mathjax-config-v2.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascripts/mathjax-render-v2.js

