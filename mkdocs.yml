site_name: Deep-UQ
site_description: Unified uncertainty quantification toolkit in PyTorch.
site_url: https://vispikarkaria.github.io/Deep-UQ/
repo_url: https://github.com/Vispikarkaria/Deep-UQ
repo_name: Vispikarkaria/Deep-UQ
edit_uri: edit/master/docs/
use_directory_urls: true
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - section-index
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      enable_parallel_processing: false
      fallback_to_build_date: true
      strict: false
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            show_source: false
            show_root_toc_entry: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            filters:
              - "!^_"
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra-v2.css

extra_javascript:
  - assets/javascripts/extra-v2.js
  - assets/javascripts/mathjax-config-v2.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - assets/javascripts/mathjax-render-v2.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Methods:
      - Deep Ensembles: methods/deep-ensembles.md
      - Variational Inference: methods/variational-inference.md
      - Laplace Approximation: methods/laplace.md
      - MCMC (SGLD): methods/mcmc-sgld.md
      - MC Dropout: methods/mc-dropout.md
      - Gaussian Processes: methods/gaussian-processes.md
  - Models:
      - Model Architectures: models/architectures.md
  - Tutorials:
      - tutorials/index.md
      - Deep Ensembles + Parametric Poisson1D: tutorials/sciml-deep-ensemble-poisson1d.md
      - Bayes by Backprop: tutorials/bayes-by-backprop.md
      - Laplace Comparison: tutorials/laplace-comparison.md
      - MC Dropout: tutorials/mc-dropout.md
      - SGLD: tutorials/sgld.md
      - Gaussian Processes: tutorials/gp.md
      - Scientific ML (DeepONet + Burgers): tutorials/sciml-deeponet-burgers.md
      - Scientific ML (DeepONet + 1D Poisson): tutorials/sciml-deeponet-poisson1d.md
      - Scientific ML (FNO2D + Darcy): tutorials/sciml-fno2d-darcy.md
      - Scientific ML (FNO3D + 3D Heat): tutorials/sciml-fno3d-heat.md
      - Scientific ML (CNN / ResNet + Heat2D): tutorials/sciml-cnn-resnet-heat2d.md
      - Scientific ML (UNet + Diffusion2D): tutorials/sciml-unet-diffusion2d.md
      - Scientific ML (PINN + Poisson): tutorials/sciml-pinn-poisson.md
  - Examples: examples/index.md
  - API:
      - api/index.md
      - Methods:
          - Deep Ensembles API: api/methods/ensembles.md
          - VI API: api/methods/vi.md
          - Laplace API: api/methods/laplace.md
          - MCMC API: api/methods/mcmc.md
          - MC Dropout API: api/methods/mc_dropout.md
      - Models:
          - MLP API: api/models/simple.md
          - Spatial Models API: api/models/spatial.md
          - PINN Models API: api/models/pinn.md
          - Gaussian Process API: api/models/gaussian_process.md
      - Utils API: api/utils.md
      - Types API: api/types.md
  - Changelog: changelog.md
  - Contributing: contributing.md
